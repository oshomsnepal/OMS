backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow
media_folder: public/images/uploads
public_folder: /images/uploads
site_url: https://oshomysteryschoolnepal.com
display_url: https://oshomysteryschoolnepal.com
logo_url: /images/brand/osho-mystery-school-logo.png

collections:
  - name: gallery
    label: Gallery
    label_singular: Gallery Photo
    folder: content/gallery
    create: true
    delete: true
    slug: "{{slug}}"
    sortable_fields: [displayOrder, title, date]
    fields:
      - { label: Photo Title, name: title, widget: string }
      - { label: Upload Photo, name: image, widget: image, required: false, hint: "Use an optimized JPG or WebP, ideally under 2 MB." }
      - { label: Photo Category, name: category, widget: select, options: [Meditation, Celebration, Nature, Retreats, Community, Our Space] }
      - { label: Caption, name: caption, widget: text, required: false }
      - { label: Date, name: date, widget: datetime, format: YYYY-MM-DD, required: false }
      - { label: Show on Homepage, name: featured, widget: boolean, default: false }
      - { label: Alternative Text, name: alt, widget: string, hint: "Briefly describe the photo for visitors using a screen reader." }
      - { label: Display Order, name: displayOrder, widget: number, value_type: int, min: 1, default: 10 }
      - { label: Image Shape, name: aspect, widget: select, options: ["3 / 2", "4 / 5", "1 / 1"], default: "3 / 2" }

  - name: events
    label: Events
    label_singular: Event
    folder: content/events
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: Event Name, name: title, widget: string }
      - { label: Start Date, name: startDate, widget: datetime, format: YYYY-MM-DD, required: false }
      - { label: End Date, name: endDate, widget: datetime, format: YYYY-MM-DD, required: false }
      - { label: Duration, name: duration, widget: string, required: false, hint: "For example: One day or 6:00 PM–9:00 PM." }
      - { label: Event Category, name: category, widget: select, options: [Festival, Intensive, Meditation Day, Celebration, Community], required: false }
      - { label: Short Description, name: shortDescription, widget: text }
      - { label: Full Description, name: body, widget: markdown, required: false }
      - { label: Upload Photo, name: image, widget: image, required: false }
      - { label: Photo Alternative Text, name: alt, widget: string, required: false }
      - { label: Location, name: location, widget: string, required: false }
      - { label: Event Status, name: status, widget: select, options: [Upcoming, Open, Full, Completed, Schedule update], default: Upcoming }
      - { label: Contribution or Price, name: price, widget: string, required: false, hint: "Enter the display wording, including currency, or write Free/Donation." }
      - label: Schedule
        name: schedule
        widget: list
        required: false
        field: { label: Schedule Item, name: item, widget: string }
      - label: What Is Included
        name: included
        widget: list
        required: false
        field: { label: Included Item, name: item, widget: string }
      - { label: Who It Is For, name: suitableFor, widget: text, required: false }
      - label: What to Bring
        name: whatToBring
        widget: list
        required: false
        field: { label: Item, name: item, widget: string }
      - { label: Registration Link, name: registrationLink, widget: string, required: false }
      - { label: Show on Homepage, name: featured, widget: boolean, default: false }
      - { label: Display Order, name: displayOrder, widget: number, value_type: int, min: 1, default: 10 }

  - name: retreats
    label: Retreats
    label_singular: Retreat
    folder: content/retreats
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: Retreat Name, name: title, widget: string }
      - { label: Short Description, name: shortDescription, widget: text }
      - { label: Full Description, name: body, widget: markdown, required: false }
      - { label: Start Date, name: startDate, widget: datetime, format: YYYY-MM-DD, required: false }
      - { label: End Date, name: endDate, widget: datetime, format: YYYY-MM-DD, required: false }
      - { label: Duration, name: duration, widget: string, required: false }
      - { label: Upload Photo, name: image, widget: image, required: false }
      - { label: Photo Alternative Text, name: alt, widget: string, required: false }
      - { label: Location, name: location, widget: string, required: false }
      - { label: Availability, name: availability, widget: select, options: [Open, Limited, Full, Completed, Schedule update], default: Schedule update }
      - { label: Contribution or Price, name: price, widget: string, required: false, hint: "Enter the display wording, including currency, or write Contact us." }
      - { label: Who It Is For, name: suitableFor, widget: text, required: false }
      - label: Daily Schedule
        name: schedule
        widget: list
        required: false
        field: { label: Schedule Item, name: item, widget: string }
      - label: What Is Included
        name: included
        widget: list
        required: false
        field: { label: Included Item, name: item, widget: string }
      - { label: Accommodation Details, name: accommodation, widget: text, required: false }
      - label: What to Bring
        name: whatToBring
        widget: list
        required: false
        field: { label: Item, name: item, widget: string }
      - { label: Registration Link, name: registrationLink, widget: string, required: false }
      - { label: Show on Homepage, name: featured, widget: boolean, default: false }
      - { label: Display Order, name: displayOrder, widget: number, value_type: int, min: 1, default: 10 }

  - name: meditations
    label: Meditations
    label_singular: Meditation
    folder: content/meditations
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: Meditation Name, name: title, widget: string }
      - { label: Short Description, name: shortDescription, widget: text }
      - { label: Full Description, name: body, widget: markdown, required: false }
      - { label: Duration, name: duration, widget: string, required: false }
      - { label: Energy Level, name: energyLevel, widget: select, options: [Gentle, Moderate, High], required: false }
      - { label: Upload Photo, name: image, widget: image, required: false }
      - { label: Photo Alternative Text, name: alt, widget: string, required: false }
      - { label: Display Order, name: displayOrder, widget: number, value_type: int, min: 1, default: 10 }

  - name: testimonials
    label: Testimonials
    label_singular: Testimonial
    folder: content/testimonials
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Country, name: country, widget: string, required: false }
      - { label: Quote, name: quote, widget: text }
      - { label: Photo, name: image, widget: image, required: false }
      - { label: Show on Homepage, name: featured, widget: boolean, default: false }
      - { label: Display Order, name: displayOrder, widget: number, value_type: int, min: 1, default: 10 }

  - name: stay
    label: Stay & Accommodation
    label_singular: Stay Section
    folder: content/stay
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: Section Title, name: title, widget: string }
      - { label: Description, name: shortDescription, widget: text }
      - { label: Upload Photo, name: image, widget: image, required: false }
      - { label: Display Order, name: displayOrder, widget: number, value_type: int, min: 1, default: 10 }
      - { label: Image Shape, name: aspect, widget: select, options: ["16 / 9", "4 / 5", "1 / 1"], default: "4 / 5" }

  - name: pages
    label: Page Content
    files:
      - label: Homepage
        name: home
        file: content/pages/home.md
        fields:
          - { label: Hero Heading, name: heroTitle, widget: string }
          - { label: Hero Subtitle, name: heroSubtitle, widget: text }
          - { label: Hero Image, name: heroImage, widget: image, required: false, hint: "Use a wide landscape image, ideally 2400 × 1350 px or a similar 16:9 ratio." }
          - { label: Hero Image Alternative Text, name: heroAlt, widget: string, required: false, hint: "Describe the photograph briefly for visitors using a screen reader." }
          - { label: Introduction, name: intro, widget: text }
          - { label: Introduction Image, name: introImage, widget: image, required: false, hint: "Portrait image, ideally a 3:4 ratio." }
          - { label: Introduction Image Alternative Text, name: introImageAlt, widget: string, required: false }
          - { label: Meditate Image, name: meditateImage, widget: image, required: false, hint: "Portrait image, ideally a 4:5 ratio." }
          - { label: Meditate Image Alternative Text, name: meditateImageAlt, widget: string, required: false }
          - { label: Go Within Image, name: goWithinImage, widget: image, required: false, hint: "Square image." }
          - { label: Go Within Image Alternative Text, name: goWithinImageAlt, widget: string, required: false }
          - { label: Celebrate Image, name: celebrateImage, widget: image, required: false, hint: "Portrait image, ideally a 4:5 ratio." }
          - { label: Celebrate Image Alternative Text, name: celebrateImageAlt, widget: string, required: false }
          - { label: Rest in Nature Image, name: restInNatureImage, widget: image, required: false, hint: "Square image." }
          - { label: Rest in Nature Image Alternative Text, name: restInNatureImageAlt, widget: string, required: false }

      - label: About Page Images
        name: about
        file: content/pages/about.md
        fields:
          - { label: Hero Image, name: heroImage, widget: image, required: false, hint: "Wide landscape image, ideally 16:9." }
          - { label: Hero Image Alternative Text, name: heroAlt, widget: string, required: false }
          - { label: Mystery School Image, name: schoolImage, widget: image, required: false, hint: "Portrait image, ideally a 3:4 ratio." }
          - { label: Mystery School Image Alternative Text, name: schoolImageAlt, widget: string, required: false }
          - { label: OSHO Portrait, name: oshoPortraitImage, widget: image, required: false, hint: "Square image." }
          - { label: OSHO Portrait Alternative Text, name: oshoPortraitAlt, widget: string, required: false }

      - label: Retreats Page Images
        name: retreats
        file: content/pages/retreats.md
        fields:
          - { label: Hero Image, name: heroImage, widget: image, required: false, hint: "Wide landscape image, ideally 16:9." }
          - { label: Hero Image Alternative Text, name: heroAlt, widget: string, required: false }
          - { label: Residential Program Image, name: residentialImage, widget: image, required: false, hint: "Portrait image, ideally a 4:5 ratio." }
          - { label: Residential Program Image Alternative Text, name: residentialImageAlt, widget: string, required: false }
          - { label: Full Moon Meditation Image, name: fullMoonImage, widget: image, required: false, hint: "Wide landscape image, ideally 16:9." }
          - { label: Full Moon Meditation Image Alternative Text, name: fullMoonImageAlt, widget: string, required: false }
          - { label: Music Gathering Image, name: musicImage, widget: image, required: false, hint: "Landscape image, ideally 4:3." }
          - { label: Music Gathering Image Alternative Text, name: musicImageAlt, widget: string, required: false }

      - label: Stay Page Images
        name: stay
        file: content/pages/stay.md
        fields:
          - { label: Hero Image, name: heroImage, widget: image, required: false, hint: "Wide landscape image, ideally 16:9." }
          - { label: Hero Image Alternative Text, name: heroAlt, widget: string, required: false }
          - { label: Meditation Hall Image, name: meditationHallImage, widget: image, required: false, hint: "Square image." }
          - { label: Meditation Hall Image Alternative Text, name: meditationHallImageAlt, widget: string, required: false }
          - { label: Garden and Dining Image, name: gardenDiningImage, widget: image, required: false, hint: "Landscape image, ideally 4:3." }
          - { label: Garden and Dining Image Alternative Text, name: gardenDiningImageAlt, widget: string, required: false }

      - label: Gallery Page Images
        name: gallery
        file: content/pages/gallery.md
        fields:
          - { label: Hero Image, name: heroImage, widget: image, required: false, hint: "Wide landscape image, ideally 16:9." }
          - { label: Hero Image Alternative Text, name: heroAlt, widget: string, required: false }
          - { label: Featured Story Image, name: featuredImage, widget: image, required: false, hint: "Very wide landscape image, ideally 16:7." }
          - { label: Featured Story Image Alternative Text, name: featuredImageAlt, widget: string, required: false }

      - label: Events Page Images
        name: events
        file: content/pages/events.md
        fields:
          - { label: Hero Image, name: heroImage, widget: image, required: false, hint: "Wide landscape image, ideally 16:9." }
          - { label: Hero Image Alternative Text, name: heroAlt, widget: string, required: false }

      - label: Visit Page Images
        name: visit
        file: content/pages/visit.md
        fields:
          - { label: Hero Image, name: heroImage, widget: image, required: false, hint: "Wide landscape image, ideally 16:9." }
          - { label: Hero Image Alternative Text, name: heroAlt, widget: string, required: false }

  - name: settings
    label: Site Settings
    files:
      - label: Contact & Site Details
        name: site
        file: content/settings/site.md
        fields:
          - { label: Phone, name: phone, widget: string, required: false }
          - { label: WhatsApp, name: whatsapp, widget: string, required: false }
          - { label: Email, name: email, widget: string, required: false }
          - { label: Address, name: address, widget: text, required: false }
          - { label: Facebook, name: facebook, widget: string, required: false }
          - { label: Instagram, name: instagram, widget: string, required: false }
          - { label: Google Maps Link, name: mapsLink, widget: string, required: false }
          - { label: Google Map Embed URL, name: mapEmbedUrl, widget: string, required: false, hint: "Use the Google Maps embed URL for the interactive map on the Visit page." }
          - { label: Booking Link, name: bookingLink, widget: string, default: /visit }
          - { label: Announcement Message, name: announcement, widget: string, required: false }
          - { label: Footer Text, name: footerText, widget: text }
